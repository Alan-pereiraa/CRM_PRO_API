version: '3.8'

services:
  api:
    build: .
    container_name: crm_pro_api
    ports:
      - 3000:3000
    restart: always
    depends_on:
      - postgres

  postgres:
    image: postgres:latest
    container_name: crm_pro_db
    ports:
      - '5432:5432'
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: crm_pro_db
    volumes:
      - ./docker/postgres-init:/docker-entrypoint-initdb.d
